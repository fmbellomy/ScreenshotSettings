# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: 'ubuntu-latest'
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v3.5
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: set 1.20.1-fabric
        run: ./gradlew "Set active project to 1.20.1-fabric"
      - name: build 1.20.1-fabric
        run: ./gradlew :1.20.1-fabric:buildAndCollect

      - name: set 1.21.1-fabric
        run: ./gradlew "Set active project to 1.21.1-fabric"
      - name: build 1.21.1-fabric
        run: ./gradlew :1.21.1-fabric:buildAndCollect

      - name: set 1.21.1-neoforge
        run: ./gradlew "Set active project to 1.21.1-neoforge"
      - name: build 1.21.1-neoforge
        run: ./gradlew :1.21.1-neoforge:buildAndCollect

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/